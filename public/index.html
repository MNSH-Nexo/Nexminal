<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebTerm</title>
  <link rel="stylesheet" href="{{WEBPATH}}/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="{{WEBPATH}}/css/style.css" />
</head>
<body>
  <!-- SETUP -->
  <section id="screen-setup" class="screen" hidden>
    <form id="setup-form" class="card">
      <div class="logo">WebTerm</div>
      <h1 id="setup-title" class="title">تنظیم اولیه</h1>
      <p id="setup-desc" class="desc">رمز عبور مدیریت را تعیین کنید تا دفعات بعد خودکار وارد شوید.</p>
      <label class="field"><span id="setup-pass-label">رمز عبور</span>
        <input type="password" id="setup-pass" autocomplete="new-password" required minlength="6" />
      </label>
      <label class="field"><span id="setup-ssh-label">SSH مقصد (پیش‌فرض: خود سرور)</span>
        <div class="row">
          <input type="text" id="setup-host" value="127.0.0.1" placeholder="127.0.0.1" />
          <input type="number" id="setup-port" value="22" style="max-width:80px" />
        </div>
        <input type="text" id="setup-user" value="root" placeholder="root" style="margin-top:8px" />
        <input type="password" id="setup-sshpass" placeholder="SSH password" style="margin-top:8px" autocomplete="off" />
      </label>
      <p id="setup-error" class="error" hidden></p>
      <button type="submit" class="btn primary" id="setup-btn">ایجاد و ورود</button>
    </form>
  </section>

  <!-- LOGIN -->
  <section id="screen-login" class="screen" hidden>
    <form id="login-form" class="card">
      <div class="logo">WebTerm</div>
      <h1 class="title" id="login-title">ورود</h1>
      <p class="desc" id="login-desc">رمز عبور مدیریت را وارد کنید.</p>
      <label class="field"><span id="login-pass-label">رمز عبور</span>
        <input type="password" id="login-pass" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">ورود</button>
    </form>
  </section>

  <!-- TERMINAL -->
  <section id="screen-term" class="screen" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="logo-sm">WebTerm</span>
        <span id="conn-status" class="badge">—</span>
      </div>
      <div class="tools">
        <button class="icon-btn" id="btn-copy" title="Copy selection">⧉ Copy</button>
        <button class="icon-btn" id="btn-paste" title="Paste">📋 Paste</button>
        <button class="icon-btn" id="btn-reconnect" title="Reconnect">↻ Reconnect</button>
        <button class="icon-btn" id="btn-font-down" title="Smaller">A−</button>
        <button class="icon-btn" id="btn-font-up" title="Larger">A+</button>
        <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
        <button class="icon-btn" id="btn-lang" title="Language">EN/FA</button>
        <button class="icon-btn accent" id="btn-menu" title="Menu">☰</button>
      </div>
    </header>
    <main class="term-wrap">
      <div id="term"></div>
      <div id="term-mask" class="term-mask" hidden>
        <div class="mask-inner">
          <div class="spinner"></div>
          <p id="mask-msg">در حال اتصال…</p>
        </div>
      </div>
    </main>
  </section>

  <!-- MENU / ADMIN -->
  <aside id="menu" class="drawer" hidden>
    <div class="drawer-head">
      <h2 id="menu-title">مدیریت</h2>
      <button class="icon-btn" id="menu-close">✕</button>
    </div>
    <div class="drawer-body">
      <div class="group" id="status-card">
        <h3 id="status-title">وضعیت سرور</h3>
        <div class="kv"><span id="st-hostname"></span><span id="st-platform"></span></div>
        <div class="kv"><span id="st-uptime"></span><span id="st-load"></span></div>
        <div class="kv"><span id="st-ssh"></span><span id="st-ssl"></span></div>
      </div>

      <div class="group">
        <h3 id="sec-pass-title">تغییر رمز عبور</h3>
        <input type="password" id="cur-pass" class="in" placeholder="رمز فعلی" autocomplete="off" />
        <input type="password" id="new-pass" class="in" placeholder="رمز جدید" autocomplete="off" />
        <button class="btn" id="btn-change-pass">ذخیره رمز</button>
        <p class="mini-msg" id="msg-pass" hidden></p>
      </div>

      <div class="group">
        <h3 id="sec-path-title">مسیر (Webpath)</h3>
        <div class="kv"><span id="cur-path"></span><span id="cur-path-val"></span></div>
        <input type="text" id="new-path" class="in" placeholder="یک مسیر دلخواه بنویسید یا رندوم بسازید" autocomplete="off" />
        <div class="btn-row">
          <button class="btn" id="btn-set-path">ذخیره مسیر</button>
          <button class="btn" id="btn-random-path">ساخت رندوم</button>
        </div>
        <p class="mini-msg warn" id="msg-path"></p>
      </div>

      <div class="group">
        <h3 id="sec-ssh-title">اتصال SSH</h3>
        <div class="row">
          <input type="text" id="ssh-host" class="in" placeholder="host" autocomplete="off" />
          <input type="number" id="ssh-port" class="in" placeholder="port" style="max-width:80px" />
        </div>
        <input type="text" id="ssh-user" class="in" placeholder="username" autocomplete="off" />
        <input type="password" id="ssh-pass" class="in" placeholder="SSH password" autocomplete="off" />
        <button class="btn" id="btn-save-ssh">ذخیره اتصال</button>
        <p class="mini-msg" id="msg-ssh" hidden></p>
      </div>

      <div class="group">
        <h3 id="sec-lang-title">زبان</h3>
        <div class="btn-row">
          <button class="btn" id="btn-lang-fa">فارسی</button>
          <button class="btn" id="btn-lang-en">English</button>
        </div>
      </div>

      <div class="group danger">
        <h3 id="sec-del-title">حذف پروژه</h3>
        <p class="mini-msg" id="del-hint">برای حذف کامل، کلمهٔ DELETE را تایپ کنید.</p>
        <input type="text" id="del-confirm" class="in" placeholder="DELETE" autocomplete="off" />
        <button class="btn danger" id="btn-delete">حذف پروژه</button>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast" hidden></div>
  <div id="overlay" class="overlay" hidden></div>

  <script src="{{WEBPATH}}/vendor/xterm/lib/xterm.js"></script>
  <script src="{{WEBPATH}}/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="{{WEBPATH}}/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="{{WEBPATH}}/js/app.js"></script>
</body>
</html>
